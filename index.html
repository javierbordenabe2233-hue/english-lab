:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#11131a,#e9ecf5);--mut:light-dark(#5b6170,#9aa3b8);--line:light-dark(#e2e5ee,#242b42);--zone:light-dark(#eef2ff,#131a31);--card:light-dark(#ffffff,#0f1426);--acc:light-dark(#1240e0,#86a2ff);--strip:light-dark(#1240e0,#0f2a9e);--ok:light-dark(#137a43,#52d18b);--okbg:light-dark(#e4f6ec,#0f2a1c);--bad:light-dark(#c0362c,#ff8b7e);--badbg:light-dark(#fdecea,#341815);--pa:light-dark(#6b3fc6,#b49bff);--pr:light-dark(#1240e0,#86a2ff);--fu:light-dark(#08806f,#4fd6c4);--ba:light-dark(#5b6170,#aab2c6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}

.top{background:var(--strip);color:#fff;padding:22px max(5vw,16px) 18px}
.top .in,.main{max-width:780px;margin:0 auto}
h1{font-size:34px;line-height:1.05;margin:0}.top p{margin:4px 0 14px;opacity:.85}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13px}.stat b{display:block;font-size:22px;line-height:1.1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px max(5vw,16px) 0;max-width:calc(780px + 10vw);margin:0 auto;scrollbar-width:none}
.tabs button{flex:none;min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-size:15px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:light-dark(#fff,#0a0d18)}
.main{padding:16px max(5vw,16px) 60px}
h2{font-size:28px;line-height:1.1;margin:4px 0 4px;text-wrap:balance}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}

.lbl.Pasado{color:var(--pa)}.lbl.Futuro{color:var(--fu)}

.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;padding:10px 0;min-height:44px;cursor:pointer}

table{border-collapse:collapse;width:100%;font-size:15px;margin:4px 0}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{font-size:13px;color:var(--mut);font-weight:600}

.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--acc)}
label.f{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input.t{display:block;width:100%;margin-top:4px;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input.t.ok{border-color:var(--ok);background:var(--okbg)}input.t.no{border-color:var(--bad);background:var(--badbg)}
.line{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin:8px 0}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--zone);color:var(--ink);font:inherit;cursor:pointer}
.line .chip{background:var(--card)}
.fb{margin-top:12px;padding:12px;border-radius:12px;background:var(--zone);font-size:15px;display:flex;gap:10px;align-items:flex-start}.fb div{flex:1}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.big{font-size:clamp(48px,12vw,72px);font-weight:700;text-align:center;line-height:1;margin:10px 0}
.pill{font-size:14px;color:var(--mut)}
.search{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:10px 0}
.nb{white-space:nowrap}
@media(max-width:600px){h1{font-size:28px}h2{font-size:24px}.qq{font-size:19px}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mut);font-size:13px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head><body>

<script>
{
const $=s=>document.querySelector(s);
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const SPK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const sp=t=>t?`<button class=sp data-say="${esc(t)}" aria-label="Escuchar">${SPK}</button>`:"";
let VO=null;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;if(!VO){const v=speechSynthesis.getVoices();VO=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}if(VO)u.voice=VO;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const tb=r=>`<table class=stack><thead><tr><th>Forma</th><th>Estructura</th><th>Ejemplo</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><i>${x[2]}</i></td></tr>`).join("")}</tbody></table>`;
const E=(uso,forma,marc,ojo)=>`<h3>¿Cuándo se usa?</h3><ul>${uso.map(u=>`<li>${u}</li>`).join("")}</ul><h3>Estructura</h3>${tb(forma)}${marc?`<h3>Palabras que suelen acompañarlo</h3><p class=chips>${marc.split(",").map(m=>`<span>${m.trim()}</span>`).join("")}</p>`:""}${ojo?`<div class=ojo><b>Ojo con esto</b>${ojo}</div>`:""}`;
const M=(q,o,a,w)=>({t:"mc",q,o,a,w});

/* ---------- TIEMPOS VERBALES ---------- */
const TN=[
{id:"g1",g:"Bases",t:"Verb to be",d:"Ser y estar",
exp:E(["Identidad, origen, profesión: <i>I am an officer.</i>","Estados y lugares: <i>She is tired. They are at home.</i>","Edad y clima: <i>I am 40. It is cold.</i>"],[["Afirmativa","I am · he/she/it is · you/we/they are","I'm from Argentina."],["Negativa","am not · isn't · aren't","It isn't cold today."],["Pregunta","Am/Is/Are + sujeto...?","Are you ready?"],["Pasado","was (I, he, she, it) · were (you, we, they)","We were at work."]],"","En inglés el sujeto es obligatorio: <i>It is cold</i>, nunca <i>Is cold</i>. La edad va con <i>be</i>: <i>I am 40</i> (no <i>I have 40</i>)."),
ex:[["I am from Argentina.","Soy de Argentina."],["She is a teacher.","Ella es docente."],["Are they at home?","¿Están en casa?"],["It isn't cold today.","Hoy no hace frío."]],
qs:[M("She ___ a teacher.",["am","is","are"],1,"She → is."),M("They ___ from Chile.",["is","am","are"],2,"They/we/you → are."),M("I ___ 40 years old.",["have","am","is"],1,"La edad se dice con to be."),M("___ you ready?",["Is","Are","Am"],1,"En preguntas el verbo va primero: Are you...?"),M("It ___ cold yesterday.",["is","was","were"],1,"Pasado de it is → it was."),W("We ___ (not / be) at work yesterday.","weren't|were not","We → were; negativo weren't.")]},
{id:"g4",g:"Bases",t:"There is / There are",d:"Hay",
exp:E(["<b>There is</b> con singular e incontables: <i>There is a bank near here.</i>","<b>There are</b> con plurales: <i>There are two cars.</i>","Pasado: <i>there was / there were</i>."],[["Afirmativa","there is / there are","There is some milk."],["Negativa","there isn't / there aren't (any)","There aren't any chairs."],["Pregunta","Is there...? / Are there...?","Is there a pharmacy near here?"]],"some, any, a lot of, how many","Los incontables (<i>water, milk, time, information</i>) van con <b>is</b>. Nunca digas <i>it has</i> para decir hay."),
ex:[["There is a bank near here.","Hay un banco cerca de acá."],["There are two chairs in the kitchen.","Hay dos sillas en la cocina."],["Is there a pharmacy near here?","¿Hay una farmacia cerca?"],["There was a lot of snow yesterday.","Ayer había mucha nieve."]],
qs:[M("There ___ a bank near here.",["are","is","be"],1,"Singular → there is."),M("There ___ two chairs in the room.",["is","are","am"],1,"Plural → there are."),M("___ there a pharmacy near here?",["Are","Do","Is"],2,"Pregunta singular → Is there...?"),M("There ___ any milk.",["aren't","isn't","don't"],1,"Milk es incontable → isn't."),M("There ___ a lot of cars at the border yesterday.",["was","were","are"],1,"Pasado plural → there were."),O("Is there a bus to the city centre?","¿Hay un colectivo al centro?")]},
{id:"g6",g:"Bases",t:"Modales: can, should, must",d:"Habilidad, consejo, obligación",
exp:E(["<b>can</b>: poder o saber hacer algo. <i>She can swim.</i>","<b>could</b>: pasado de can, o pedido amable. <i>Could you help me?</i>","<b>should</b>: consejo. <i>You should rest.</i>","<b>must</b>: obligación fuerte o regla. <i>You must show your passport.</i>","<b>have to</b>: obligación externa. <i>I have to work on Sunday.</i>"],[["Afirmativa","modal + verbo base","He can drive."],["Negativa","can't · shouldn't · mustn't","You mustn't park here."],["Pregunta","Modal + sujeto + verbo?","Can I help you?"]],"","Los modales no llevan <i>to</i> ni <i>-s</i>: <i>she can swim</i>, nunca <i>she cans</i> ni <i>can to swim</i>. Además, <b>mustn't</b> = está prohibido, pero <b>don't have to</b> = no hace falta."),
ex:[["She can speak three languages.","Ella habla tres idiomas."],["You should see a doctor.","Deberías ver a un médico."],["You must wear a seat belt.","Tenés que usar el cinturón."],["You don't have to pay.","No hace falta que pagues."]],
qs:[M("She ___ speak three languages.",["can","cans","can to"],0,"Los modales no llevan -s ni to."),M("You look tired. You ___ rest.",["must","should","can"],1,"Consejo → should."),M("You ___ show your passport. It's the law.",["must","can","might"],0,"Obligación fuerte → must."),M("You ___ park here. It's forbidden.",["mustn't","don't have to","shouldn't to"],0,"Prohibido → mustn't."),M("He ___ come early. It's optional.",["mustn't","doesn't have to","can't"],1,"No es necesario → doesn't have to."),O("Could you speak more slowly, please?","¿Podría hablar más despacio, por favor?")]},

{id:"t1",g:"Presente",t:"Present Simple",d:"Rutinas, hábitos y verdades",tl:[["ds",8,92,7]],
exp:E(["Rutinas y hábitos: <i>I start work at 8.</i>","Verdades y hechos generales: <i>Water boils at 100 °C.</i>","Horarios fijos: <i>The bus leaves at 7.</i>","Verbos de estado: <i>I know, I like, I need, I want.</i>"],[["Afirmativa","sujeto + verbo (he/she/it + -s)","She works at the border."],["Negativa","don't / doesn't + verbo base","He doesn't work on Sundays."],["Pregunta","Do / Does + sujeto + verbo base?","Does she speak English?"],["Respuesta corta","Yes, she does. / No, she doesn't.","Do you live here? Yes, I do."]],"always, usually, often, sometimes, never, every day, on Mondays, once a week","Con he/she/it el verbo lleva -s: <i>watches, studies, has, goes</i>. Pero con <i>does / doesn't</i> la -s desaparece: <i>Does she work?</i> El adverbio de frecuencia va antes del verbo, pero después de <i>be</i>: <i>I always work / I am always tired</i>."),
ex:[["I usually start my shift at eight.","Normalmente empiezo el turno a las ocho."],["He doesn't drink coffee.","Él no toma café."],["Does the bus stop here?","¿El colectivo para acá?"],["It snows a lot in winter.","Nieva mucho en invierno."]],
qs:[M("She ___ at the border every weekend.",["work","works","is work"],1,"She → verbo con -s."),W("My boss ___ (not / like) long reports.","doesn't like|does not like","He/she → doesn't + verbo base."),M("___ the bus to Río Grande leave at 7?",["Do","Does","Is"],1,"The bus = it → Does."),W("He ___ (study) English on Tuesdays.","studies","Consonante + y → -ies."),M("Where does she ___?",["lives","live","living"],1,"Después de does va el verbo base."),O("What time do you usually start work?","¿A qué hora empezás a trabajar normalmente?"),M("I ___ late.",["am never","never am","never be"],0,"Con to be el adverbio va después: I am never late."),W("Water ___ (boil) at 100 degrees.","boils","Verdad general → present simple.")]},
{id:"t2",g:"Presente",t:"Present Continuous",d:"Lo que pasa ahora",tl:[["r",40,60,1]],
exp:E(["Algo que está pasando ahora: <i>I'm checking your passport.</i>","Situaciones temporales: <i>I'm living in Ushuaia this year.</i>","Planes ya arreglados (con día u hora): <i>I'm meeting my boss tomorrow.</i>","Cambios en curso: <i>Prices are going up.</i>"],[["Afirmativa","am / is / are + verbo-ing","They are waiting in the queue."],["Negativa","am not / isn't / aren't + verbo-ing","We aren't working today."],["Pregunta","Am / Is / Are + sujeto + verbo-ing?","Are you travelling alone?"]],"now, right now, at the moment, today, this week, currently, Look!, Listen!","Los verbos de estado casi nunca van en -ing: <i>know, want, like, need, believe, understand, own</i>. Se dice <i>I understand</i>, no <i>I'm understanding</i>. Ortografía: <i>make → making, run → running, lie → lying</i>."),
ex:[["I'm checking your documents now.","Estoy revisando tus documentos ahora."],["It's snowing in the pass.","Está nevando en el paso."],["She's working nights this month.","Ella está trabajando de noche este mes."],["What are you doing?","¿Qué estás haciendo?"]],
qs:[M("Look! It ___.",["snows","is snowing","snowing"],1,"Look! → algo que pasa ahora."),W("They ___ (wait) in the queue right now.","are waiting","They → are + -ing."),M("I ___ what you mean.",["am understanding","understand","understanding"],1,"Understand es un verbo de estado: no va en -ing."),W("(you / travel) alone? → ___ alone?","are you travelling|are you traveling","Pregunta: Are + you + -ing."),M("She ___ in Ushuaia this year, but she's from Córdoba.",["lives","is living","live"],1,"Situación temporal → present continuous."),W("We ___ (not / work) today. It's a holiday.","aren't working|are not working","Negativo: aren't + -ing."),O("I'm meeting my boss tomorrow","Me reúno con mi jefe mañana (ya está arreglado)."),M("Listen! Someone ___ at the door.",["knocks","is knocking","knock"],1,"Listen! → ahora mismo.")]},

{id:"t3",g:"Pasado",t:"Past Simple",d:"Acciones terminadas",tl:[["d",25]],
exp:E(["Acciones terminadas en un momento concreto del pasado: <i>I worked yesterday.</i>","Una secuencia de hechos: <i>I arrived, checked the list and opened the gate.</i>","Hábitos del pasado que ya terminaron: <i>I lived in Córdoba for ten years.</i>"],[["Afirmativa","verbo + -ed (o forma irregular)","I checked 200 cars yesterday."],["Negativa","didn't + verbo base","She didn't see the sign."],["Pregunta","Did + sujeto + verbo base?","Did you see the game?"],["To be","was / were · wasn't / weren't","Were you at work?"]],"yesterday, last night, last week, ago, in 2019, when I was a child","Después de <i>did / didn't</i> el verbo vuelve a la forma base: <i>I didn't go</i>, nunca <i>I didn't went</i>. Pronunciación de -ed: /t/ en <i>worked</i>, /d/ en <i>played</i>, /ɪd/ en <i>wanted</i>. Los irregulares tienen su propia pestaña para practicar."),

qs:[M("I ___ to Chile last summer.",["go","went","gone"],1,"Go es irregular: went."),W("She ___ (not / see) the sign.","didn't see|did not see","Didn't + verbo base."),M("___ you at work yesterday?",["Did","Was","Were"],2,"Con to be: Were you...?"),W("We ___ (arrive) at 6 a.m.","arrived","Regular: arrive + d."),M("He didn't ___ the form.",["filled","fill","fills"],1,"Después de didn't va el verbo base."),W("They ___ (buy) souvenirs in Ushuaia.","bought","Buy es irregular: bought."),O("Where did you stay last night?","¿Dónde te quedaste anoche?"),M("The truck ___ two hours ago.",["has arrived","arrived","arrives"],1,"Ago marca un momento terminado → past simple.")]},
{id:"t4",g:"Pasado",t:"Past Continuous",d:"Lo que estaba pasando",tl:[["r",12,38,1],["ref",28,"interrupción"]],
exp:E(["Una acción en progreso en un momento del pasado: <i>At 8 I was driving to work.</i>","Una acción larga interrumpida por otra corta: <i>I was sleeping when the phone rang.</i>","Dos acciones al mismo tiempo: <i>While I was cooking, she was reading.</i>","Para describir la escena de una historia: <i>It was snowing and people were waiting.</i>"],[["Afirmativa","was / were + verbo-ing","They were waiting at the border."],["Negativa","wasn't / weren't + verbo-ing","It wasn't raining."],["Pregunta","Was / Were + sujeto + verbo-ing?","What were you doing at 10?"]],"while, when, at 8 o'clock, all morning, at that moment","<b>While</b> suele ir con la acción larga (continuous) y <b>when</b> con la corta (past simple): <i>I was driving when it started to snow.</i> En español es el pretérito imperfecto: <i>estaba manejando</i>."),
ex:[["I was driving when it started to snow.","Estaba manejando cuando empezó a nevar."],["What were you doing at ten?","¿Qué estabas haciendo a las diez?"],["While I was checking the documents, the bus left.","Mientras revisaba los documentos, el colectivo se fue."]],
qs:[M("I ___ when the phone rang.",["slept","was sleeping","were sleeping"],1,"Acción larga interrumpida → was + -ing."),W("They ___ (wait) at the border when the storm started.","were waiting","They → were + -ing."),M("What ___ you doing at 10 last night?",["was","were","did"],1,"You → were."),M("While I ___ the documents, the bus left.",["was checking","checked","am checking"],0,"While + acción larga → past continuous."),W("It ___ (not / rain) when we left.","wasn't raining|was not raining","It → wasn't + -ing."),M("I was driving to work when I ___ an accident.",["was seeing","saw","see"],1,"La acción corta va en past simple."),O("What were you doing at 8 o'clock?","¿Qué estabas haciendo a las 8?"),W("The tourists ___ (take) photos while the guide was talking.","were taking","Dos acciones simultáneas en progreso.")]},
{id:"t5",g:"Presente",t:"Present Perfect",d:"Pasado conectado con el ahora",tl:[["r",20,50,0],["d",20]],
exp:E(["Experiencias de vida, sin decir cuándo: <i>Have you ever been to Bali?</i>","Algo pasado con resultado ahora: <i>I've lost my passport.</i> (y no lo tengo)","Algo que empezó antes y sigue: <i>She has worked here since 2018.</i>","Con <i>just, already, yet</i>: <i>The bus has just arrived.</i>"],[["Afirmativa","have / has + participio","She has worked here for years."],["Negativa","haven't / hasn't + participio","They haven't finished yet."],["Pregunta","Have / Has + sujeto + participio?","Have you ever been to London?"]],"ever, never, just, already, yet, for, since, so far, this week, recently","Es el tiempo que más confunde a los hispanohablantes. <b>Nunca</b> se usa con un momento terminado: <i>I saw him yesterday</i>, no <i>I have seen him yesterday</i>. <b>For</b> = duración (<i>for three years</i>); <b>since</b> = punto de inicio (<i>since 2019</i>). Y <i>hace 5 años que trabajo acá</i> se dice <i>I have worked here for five years</i>, no <i>I work here since...</i>"),
ex:[["I have just checked your passport.","Acabo de revisar tu pasaporte."],["Have you ever seen a glacier?","¿Alguna vez viste un glaciar?"],["She has lived in Ushuaia since 2015.","Vive en Ushuaia desde 2015."],["We haven't had lunch yet.","Todavía no almorzamos."]],
qs:[M("Have you ever ___ to Bali?",["went","been","go"],1,"Experiencia: have been."),W("She ___ (work) here since 2018.","has worked","Empezó antes y sigue → has + participio."),M("I've lived in Ushuaia ___ ten years.",["since","for","ago"],1,"Duración → for."),M("I've lived in Ushuaia ___ 2015.",["for","since","ago"],1,"Punto de inicio → since."),M("I ___ him yesterday.",["have seen","saw","has seen"],1,"Yesterday es un momento terminado → past simple."),W("They ___ (not / finish) the report yet.","haven't finished|have not finished","Negativo + yet."),M("___ the bus arrived yet?",["Has","Have","Did"],0,"The bus = it → Has."),O("I have just checked your passport","Acabo de revisar tu pasaporte."),W("Hace 3 años que trabajo acá → I ___ (work) here for three years.","have worked","Hace... que + presente en español = present perfect en inglés.")]},
{id:"t6",g:"Presente",t:"Present Perfect Continuous",d:"Desde hace un rato, y sigue",tl:[["r",18,50,1]],
exp:E(["Una acción que empezó antes y sigue, destacando cuánto dura: <i>I've been waiting for two hours.</i>","Actividad reciente con resultado visible: <i>You're wet. Have you been running?</i>","Para preguntar <i>how long</i>: <i>How long have you been learning English?</i>"],[["Afirmativa","have / has been + verbo-ing","It has been snowing all day."],["Negativa","haven't / hasn't been + verbo-ing","I haven't been sleeping well."],["Pregunta","Have / Has + sujeto + been + verbo-ing?","How long have you been waiting?"]],"for, since, how long, all day, lately, recently","Con verbos de estado se usa el present perfect simple: <i>I've known him for years</i>, no <i>I've been knowing</i>. Y si contás cantidades terminadas, va simple: <i>I've written three reports</i> (no <i>been writing three</i>)."),
ex:[["I've been waiting for two hours.","Hace dos horas que estoy esperando."],["It has been snowing since this morning.","Está nevando desde esta mañana."],["How long have you been learning English?","¿Hace cuánto que estudiás inglés?"]],
qs:[M("How long ___ you been waiting?",["has","have","are"],1,"You → have been."),W("I ___ (wait) for two hours!","have been waiting","Duración que sigue → have been + -ing."),M("I ___ her for ten years.",["have been knowing","have known","am knowing"],1,"Know es de estado → present perfect simple."),M("Your eyes are red. ___ you been crying?",["Did","Have","Are"],1,"Resultado visible → Have you been...?"),W("She ___ (work) all day. She's exhausted.","has been working","She → has been + -ing."),M("I ___ three reports today.",["have been writing","have written"],1,"Cantidad terminada → simple."),O("It has been snowing since this morning","Está nevando desde esta mañana."),W("Hace una hora que estamos esperando → We ___ (wait) for an hour.","have been waiting","Hace... que + acción en curso.")]},
{id:"t7",g:"Pasado",t:"Past Perfect",d:"El pasado del pasado",tl:[["d",15],["ref",34,"otro pasado"]],
exp:E(["Una acción anterior a otro momento del pasado: <i>When I arrived, the bus had left.</i>","Para explicar causas en una historia: <i>He was nervous because he had never flown.</i>","En el estilo indirecto: <i>She said she had lost her ID.</i>"],[["Afirmativa","had + participio","They had already closed the border."],["Negativa","hadn't + participio","I hadn't seen snow before."],["Pregunta","Had + sujeto + participio?","Had you finished your shift?"]],"before, after, already, by the time, when, never... before","Compará: <i>When I arrived, the bus left</i> (salió cuando llegué) y <i>When I arrived, the bus had left</i> (ya se había ido). Es el pluscuamperfecto: <i>había salido</i>."),
ex:[["When we got there, the bus had left.","Cuando llegamos, el colectivo ya se había ido."],["She had never seen snow before.","Nunca había visto nieve."],["They had already closed the border.","Ya habían cerrado el paso."]],
qs:[M("When we got to the station, the train ___.",["left","had left","has left"],1,"Se fue antes de que llegáramos → had left."),W("She ___ (never / see) snow before she came to Ushuaia.","had never seen","Antes de otro pasado → had + participio."),M("By the time the police arrived, the thief ___.",["had escaped","escaped","has escaped"],0,"By the time + pasado → past perfect."),W("I didn't recognise him because he ___ (change) a lot.","had changed","El cambio fue anterior."),M("___ you finished your shift when they called?",["Have","Had","Did"],1,"Pregunta: Had + sujeto + participio."),O("They had already closed the border","Ya habían cerrado el paso."),W("He was nervous because he ___ (not / fly) before.","hadn't flown|had not flown","Fly → flown."),M("After she ___ dinner, she went to bed.",["had had","has had","have"],0,"Had (auxiliar) + had (participio de have).")]},
{id:"t8",g:"Pasado",t:"Past Perfect Continuous",d:"Venía pasando hasta un punto",tl:[["r",6,32,1],["ref",32,"punto"]],
exp:E(["Una acción que venía durando hasta otro momento del pasado: <i>We had been waiting for hours when the road opened.</i>","Para explicar un resultado del pasado: <i>She was tired because she had been working all night.</i>"],[["Afirmativa","had been + verbo-ing","They had been driving for ten hours."],["Negativa","hadn't been + verbo-ing","He hadn't been sleeping well."],["Pregunta","Had + sujeto + been + verbo-ing?","How long had you been waiting?"]],"for, since, how long, when, before, all day","En español suele ser <i>hacía... que</i> o <i>venía + gerundio</i>: <i>Hacía dos años que vivía ahí</i> = <i>I had been living there for two years</i>."),
ex:[["We had been waiting for three hours when the road opened.","Hacía tres horas que esperábamos cuando abrieron el camino."],["His clothes were wet. He had been walking in the rain.","Tenía la ropa mojada. Había estado caminando bajo la lluvia."]],
qs:[M("We ___ for three hours when the road opened.",["had been waiting","have been waiting","were waiting"],0,"Duración hasta un punto del pasado."),W("She was tired because she ___ (work) all night.","had been working","Causa de un resultado pasado."),M("How long ___ they been driving before they stopped?",["have","had","were"],1,"Had + been + -ing."),W("His clothes were wet. He ___ (walk) in the rain.","had been walking","Actividad anterior con resultado."),O("I had been living there for two years","Hacía dos años que vivía ahí."),M("It ___ snowing for days before the pass closed.",["has been","had been","was been"],1,"Antes de otro pasado → had been.")]},
{id:"t9",g:"Pasado",t:"Used to / would",d:"Lo que solías hacer",tl:[["ds",6,38,5]],
exp:E(["Hábitos del pasado que ya no ocurren: <i>I used to play football.</i>","Estados del pasado que cambiaron: <i>I used to live in Buenos Aires.</i>","<b>would</b> también sirve para acciones repetidas (no para estados): <i>Every summer we would go camping.</i>"],[["Afirmativa","used to + verbo base","We used to go camping."],["Negativa","didn't use to + verbo base","She didn't use to like coffee."],["Pregunta","Did + sujeto + use to + verbo base?","Did you use to smoke?"]],"when I was a child, years ago, before, back then","No confundir con <b>be used to + -ing</b> = estar acostumbrado: <i>I'm used to the cold.</i> En negativa y pregunta se escribe <i>use to</i> (sin d)."),
ex:[["I used to live in Buenos Aires.","Antes vivía en Buenos Aires."],["We used to go camping every summer.","Solíamos ir de campamento todos los veranos."],["I'm used to the wind now.","Ya estoy acostumbrado al viento."]],
qs:[M("I ___ live in Buenos Aires, but now I live in Ushuaia.",["use to","used to","am used to"],1,"Hábito o estado pasado → used to."),W("She ___ (not / like) coffee, but now she loves it.","didn't use to like|did not use to like","Negativa: didn't use to."),M("___ you use to play football?",["Do","Did","Were"],1,"Pregunta: Did + use to."),M("I'm ___ the cold now.",["used to","use to","using to"],0,"Be used to = estar acostumbrado."),M("When I was a child, I ___ have long hair.",["would","used to"],1,"Estado (tener pelo largo) → used to, no would."),O("We used to go camping every summer","Solíamos ir de campamento todos los veranos.")]},

{id:"t10",g:"Futuro",t:"Future: will",d:"Decisiones al momento y predicciones",tl:[["d",75]],
exp:E(["Decisiones espontáneas: <i>I'm cold. I'll close the window.</i>","Predicciones u opiniones: <i>I think it will snow.</i>","Promesas, ofrecimientos y pedidos: <i>I'll help you. Will you sign here?</i>"],[["Afirmativa","will ('ll) + verbo base","I'll send you the report."],["Negativa","won't + verbo base","She won't come."],["Pregunta","Will + sujeto + verbo base?","Will you help me?"]],"I think, probably, I'm sure, maybe, tomorrow, next week, soon","Después de <i>when, if, as soon as, before</i> no va will aunque hables del futuro: <i>I'll call you when I arrive</i>, no <i>when I will arrive</i>."),
ex:[["I'll help you with your bags.","Te ayudo con las valijas."],["I think it will snow tomorrow.","Creo que mañana va a nevar."],["She won't be late.","No va a llegar tarde."]],
qs:[M("The phone is ringing. I ___ get it.",["am going to","will","am"],1,"Decisión en el momento → will."),W("I promise I ___ (not / tell) anyone.","won't tell|will not tell","Promesa negativa → won't."),M("I think it ___ snow tomorrow.",["will","is","does"],0,"Opinión sobre el futuro → will."),M("I'll call you when I ___.",["will arrive","arrive","arrived"],1,"Después de when va presente."),W("(you / help) → ___ me with these bags?","will you help","Pedido → Will you...?"),O("I will send you the report tomorrow","Te mando el informe mañana.")]},
{id:"t11",g:"Futuro",t:"Future: going to",d:"Planes e intenciones",tl:[["dash",50,78]],
exp:E(["Planes o intenciones ya decididos: <i>We're going to travel to Bali next year.</i>","Predicción con evidencia ahora: <i>Look at the clouds! It's going to rain.</i>","Para arreglos con día y hora, también sirve el present continuous: <i>I'm flying on Monday.</i>"],[["Afirmativa","am / is / are going to + verbo base","She's going to start a new job."],["Negativa","isn't / aren't going to + verbo base","I'm not going to work tomorrow."],["Pregunta","Am / Is / Are + sujeto + going to...?","What are you going to do?"]],"tomorrow, next week, this weekend, soon, Look!","<b>Will</b> = lo decido ahora. <b>Going to</b> = ya lo había decidido. <i>Gonna</i> es la forma hablada informal de going to; no se escribe en textos formales."),
ex:[["Look at the clouds! It's going to rain.","¡Mirá las nubes! Va a llover."],["We're going to travel next month.","Vamos a viajar el mes que viene."],["I'm flying to Buenos Aires on Monday.","Vuelo a Buenos Aires el lunes."]],
qs:[M("We ___ travel to Bali next year. We've booked the tickets.",["will","are going to","go"],1,"Plan ya decidido → going to."),M("Look at that car! It ___ crash!",["will","is going to","crashes"],1,"Evidencia ahora → going to."),W("I ___ (not / work) tomorrow. I've got a day off.","am not going to work|'m not going to work|am not working","Plan negativo."),M("I ___ the dentist at 5 tomorrow.",["see","am seeing","will see"],1,"Cita arreglada → present continuous."),W("(you / do) → What ___ this weekend?","are you going to do|are you doing","Pregunta sobre planes."),O("She is going to start a new job","Ella va a empezar un trabajo nuevo.")]},
{id:"t12",g:"Futuro",t:"Future Continuous",d:"Lo que estará pasando",tl:[["r",66,86,1],["ref",76,"momento futuro"]],
exp:E(["Una acción en progreso en un momento del futuro: <i>This time tomorrow I'll be flying.</i>","Para preguntar por planes de forma educada: <i>Will you be using the car tonight?</i>"],[["Afirmativa","will be + verbo-ing","I'll be working at 9."],["Negativa","won't be + verbo-ing","We won't be sleeping."],["Pregunta","Will + sujeto + be + verbo-ing?","Will you be using the car?"]],"this time tomorrow, at 9 tonight, next week, all day","En español suele ser <i>voy a estar + gerundio</i>: <i>Te voy a estar esperando</i> = <i>I'll be waiting for you</i>."),
ex:[["This time tomorrow I'll be flying to Bali.","Mañana a esta hora voy a estar volando a Bali."],["Don't call at nine, I'll be working.","No llames a las nueve, voy a estar trabajando."]],
qs:[M("This time tomorrow I ___ to Buenos Aires.",["will fly","will be flying","am fly"],1,"En progreso en un momento futuro."),W("Don't call at 9. I ___ (work).","will be working|'ll be working","Will be + -ing."),M("___ you be using the car tonight?",["Are","Will","Do"],1,"Will + sujeto + be + -ing."),W("At midnight we ___ (sleep).","will be sleeping|'ll be sleeping","Acción en curso a medianoche."),O("I will be waiting for you at the border","Te voy a estar esperando en el paso."),M("Next week she ___ on the night shift.",["will be working","will working","is work"],0,"Will be + -ing.")]},
{id:"t13",g:"Futuro",t:"Future Perfect",d:"Lo que ya habrá pasado",tl:[["d",68],["ref",84,"fecha límite"]],
exp:E(["Algo que estará terminado antes de un momento futuro: <i>By 6 p.m. I'll have finished the report.</i>"],[["Afirmativa","will have + participio","By Friday I'll have finished."],["Negativa","won't have + participio","She won't have arrived by then."],["Pregunta","Will + sujeto + have + participio?","Will you have finished by 5?"]],"by (para), by the time, by then, before, by next year","<i>By</i> acá significa <i>para / antes de</i>: <i>by Friday</i> = para el viernes. En español: <i>habré terminado</i> o <i>voy a haber terminado</i>."),
ex:[["By Friday I'll have finished the report.","Para el viernes voy a haber terminado el informe."],["By next year I will have learned English.","Para el año que viene voy a haber aprendido inglés."]],
qs:[M("By Friday, I ___ the report.",["will finish","will have finished","have finished"],1,"Terminado antes de una fecha → will have + participio."),W("By 2030 they ___ (build) the new road.","will have built|'ll have built","Build → built."),M("___ you have finished by 5?",["Will","Have","Do"],0,"Will + sujeto + have..."),W("She ___ (not / arrive) by then.","won't have arrived|will not have arrived","Negativa: won't have."),O("By next year I will have learned English","Para el año que viene voy a haber aprendido inglés."),M("By the time you arrive, we ___ dinner.",["will have had","have had","had"],0,"Terminado antes de que llegues.")]},

{id:"t14",g:"Más",t:"Condicionales",d:"If: real, posible e imaginario",
exp:`<h3>Los cuatro tipos</h3><table class=stack><thead><tr><th>Tipo</th><th>Estructura</th><th>Ejemplo</th></tr></thead><tbody><tr><td><b>Cero</b>: siempre es así</td><td>If + presente, presente</td><td><i>If you heat ice, it melts.</i></td></tr><tr><td><b>Primero</b>: posible y real</td><td>If + presente, will + verbo</td><td><i>If it snows, the pass will close.</i></td></tr><tr><td><b>Segundo</b>: imaginario ahora</td><td>If + pasado, would + verbo</td><td><i>If I had more time, I would travel more.</i></td></tr><tr><td><b>Tercero</b>: pasado que no fue</td><td>If + had + participio, would have + participio</td><td><i>If we had left earlier, we would have caught the bus.</i></td></tr></tbody></table><div class=ojo><b>Ojo con esto</b>Nunca va <i>will</i> ni <i>would</i> en la parte del <i>if</i>. En el segundo tipo se usa <i>were</i> para todos: <i>If I were you...</i> (si yo fuera vos).</div>`,
ex:[["If it snows, the pass will close.","Si nieva, van a cerrar el paso."],["If I were you, I would study every day.","Yo que vos, estudiaría todos los días."],["What would you do if you won the lottery?","¿Qué harías si ganaras la lotería?"],["If we had left earlier, we would have caught the bus.","Si hubiéramos salido antes, habríamos alcanzado el colectivo."]],
qs:[M("If it snows, the pass ___ closed.",["will be","would be","is being"],0,"Posible y real → will."),M("If I ___ more money, I would travel to Bali.",["have","had","will have"],1,"Imaginario → if + pasado."),M("If I ___ you, I would study every day.",["was","were","am"],1,"If I were you: forma fija."),W("If we had left earlier, we ___ (catch) the bus.","would have caught|'d have caught","Tercer condicional."),M("If you heat ice, it ___.",["melts","will melt","would melt"],0,"Verdad general → condicional cero."),W("If she ___ (study), she will pass the exam.","studies","Sin will en la parte del if."),M("I would have called you if I ___ your number.",["had","had had","have"],1,"Tercer condicional: had + participio (had)."),O("What would you do if you won the lottery?","¿Qué harías si ganaras la lotería?")]},
{id:"t15",g:"Más",t:"¿Cuál uso? Comparaciones",d:"Español → inglés y tiempos mezclados",
exp:`<h3>Del español al inglés</h3><table class=stack><thead><tr><th>Español</th><th>Inglés</th><th>Tiempo</th></tr></thead><tbody><tr><td>trabajo</td><td>I work / I'm working</td><td>Present simple / continuous</td></tr><tr><td>trabajé</td><td>I worked</td><td>Past simple</td></tr><tr><td>he trabajado · hace años que trabajo</td><td>I have worked</td><td>Present perfect</td></tr><tr><td>trabajaba (en ese momento)</td><td>I was working</td><td>Past continuous</td></tr><tr><td>trabajaba (antes, de costumbre)</td><td>I used to work</td><td>Used to</td></tr><tr><td>había trabajado</td><td>I had worked</td><td>Past perfect</td></tr><tr><td>trabajaré · voy a trabajar</td><td>I will work / I'm going to work</td><td>Futuro</td></tr><tr><td>trabajaría</td><td>I would work</td><td>Condicional</td></tr><tr><td>habré trabajado</td><td>I will have worked</td><td>Future perfect</td></tr></tbody></table><h3>Pares que se confunden</h3><ul><li><b>Present simple vs continuous</b>: hábito (<i>I work nights</i>) vs ahora o temporal (<i>I'm working nights this month</i>).</li><li><b>Past simple vs present perfect</b>: momento terminado (<i>I lost my keys yesterday</i>) vs resultado ahora (<i>I've lost my keys</i>).</li><li><b>Past simple vs past continuous</b>: acción corta vs acción larga de fondo (<i>I was driving when I saw it</i>).</li><li><b>Will vs going to</b>: lo decido ahora vs ya estaba decidido.</li></ul>`,
ex:[["I've lost my keys. I can't open the door.","Perdí las llaves. No puedo abrir la puerta."],["I lost my keys yesterday.","Ayer perdí las llaves."],["I work nights, but this week I'm working mornings.","Trabajo de noche, pero esta semana estoy de mañana."]],
qs:[M("I ___ in Ushuaia since 2015.",["live","am living","have lived"],2,"Since + sigue ahora → present perfect."),M("She ___ TV when I called her.",["watched","was watching","has watched"],1,"Acción de fondo interrumpida."),M("Water ___ at 0 °C.",["freezes","is freezing","froze"],0,"Verdad general."),M("I ___ my keys! I can't open the door.",["lost","have lost","was losing"],1,"Resultado ahora → present perfect."),M("We ___ to Chile in 2022.",["have gone","went","were going"],1,"Fecha terminada → past simple."),M("Shh! The baby ___.",["sleeps","is sleeping","slept"],1,"Ahora mismo → continuous."),M("When I arrived, everyone ___ home.",["went","had gone","has gone"],1,"Antes de otro pasado → past perfect."),M("Hacía años que no lo veía → I ___ him for years.",["didn't see","hadn't seen","haven't seen"],1,"Hacía... que (pasado) → past perfect."),M("This time tomorrow I ___ on the plane.",["will sit","will be sitting","sit"],1,"En progreso en el futuro."),M("Don't worry, I ___ you.",["am helping","will help","help"],1,"Ofrecimiento → will.")]}
];

/* ---------- COMPARAR RESPUESTAS ---------- */
function norm(s,v){s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/n't/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/[.,!?¿¡;:"()]/g," ").replace(/\s+/g," ").trim();if(v)s=s.replace(/^(to|the|a|an|el|la|los|las|un|una) /,"");return s}
const match=(g,list,v)=>list.some(a=>norm(g,v)==norm(a,v));

/* ---------- GENERADORES ---------- */
const alts=s=>[s,...s.split("/").map(x=>x.trim())];
function genV(words,n){const ws=sh(words).slice(0,n||8);return ws.map((w,i)=>{const t=i%4,[en,es]=w;
 if(t<2){const k=t==0?1:0,pool=sh(words.filter(x=>x[1]!=es&&x[0]!=en)).slice(0,3).map(x=>x[k]);const o=[w[k],...pool];return{t:"mc",q:t==0?`¿Qué significa <b>${en}</b>?`:`¿Cómo se dice <b>${es}</b> en inglés?`,o,a:0,w:`${en} = ${es}`,say:en,sayQ:t==0?en:"",v:1}}
 if(t==2)return{t:"w",q:`Escribí en inglés: <b>${es}</b>`,f:[{a:alts(en)}],w:`${en} = ${es}`,say:en,v:1};
 return{t:"w",q:`Escribí en español: <b>${en}</b>`,f:[{a:alts(es)}],w:`${en} = ${es}`,say:en,sayQ:en,v:1}})}
function genI(list){return sh(list).slice(0,8).map(r=>({t:"w",q:`<b>${r[0]}</b> <span class=pill>(${r[3]})</span>`,f:[{l:"Pasado",a:alts(r[1])},{l:"Participio",a:alts(r[2])}],w:`${r[0]} → ${r[1]} → ${r[2]}`,say:`${r[0]}, ${r[1].replace("/"," or ")}, ${r[2].replace("/"," or ")}`,sayQ:r[0]}))}
function genF(g,n){const its=sh(g.w).slice(0,n||8);return its.map((p,i)=>i%2==0?{t:"mc",q:`¿Cómo se dice: <b>${p[1]}</b>?`,o:[p[0],...sh(g.w.filter(x=>x!==p)).slice(0,2).map(x=>x[0])],a:0,w:"",say:p[0]}:O(p[0],p[1]))}

/* ---------- QUIZ ---------- */
const keyOf=q=>q.t+"|"+(q.q||q.s);
function prep(q){const c={...q,raw:q};if(q.t=="mc"){const ix=sh(q.o.map((_,i)=>i));c.o=ix.map(i=>q.o[i]);c.a=ix.indexOf(q.a)}if(q.t=="ord"){c.pool=sh(q.s.split(" ").map((w,i)=>({w,i})));c.built=[]}return c}
function start(qs,id,title,rep){if(!qs.length)return;S.Q={qs:qs.map(prep),i:0,s:0,st:null,id,title,rep};R();scrollTo(0,0)}
function spoken(q){if(q.t=="ord")return q.s;if(q.say)return q.say;let x=q.q;if(x.includes("→"))x=x.split("→").pop();if(!x.includes("___"))return"";const ans=q.t=="mc"?q.o[q.a]:q.f[0].a[0];return x.replace(/\(.*?\)/g,"").replace("___",ans).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim()}
function addErr(q){const k=keyOf(q);if(!P.err.some(e=>keyOf(e)==k)){P.err.push(q);if(P.err.length>80)P.err.shift()}}
function delErr(q){const k=keyOf(q);P.err=P.err.filter(e=>keyOf(e)!=k)}
function grade(ok,given){const Q=S.Q,q=Q.qs[Q.i];Q.st={ok,given};if(ok){Q.s++;delErr(q.raw)}else addErr(q.raw);save();R()}
function check(){const Q=S.Q,q=Q.qs[Q.i];if(Q.st)return;
 if(q.t=="w"){const g=q.f.map((_,j)=>($("#f"+j)||{}).value||"");if(g.every(x=>!x.trim()))return;grade(q.f.every((f,j)=>match(g[j],f.a,q.v)),g)}
 if(q.t=="ord"){grade(norm(q.built.map(b=>b.w).join(" "))==norm(q.s),[])}}
function next(){const Q=S.Q;Q.st=null;Q.i++;if(Q.i>=Q.qs.length){Q.end=true;const p=Math.round(Q.s/Q.qs.length*100);if(Q.id)P.s[Q.id]=Math.max(P.s[Q.id]||0,p);const t=day(0);if(P.last!=t){P.streak=P.last==day(1)?P.streak+1:1;P.last=t}save()}R();scrollTo(0,0)}

/* ---------- LÍNEA DE TIEMPO ---------- */
function TL(m){if(!m)return"";const X=x=>20+x*2.6,y=44;let s=`<svg class=tl viewBox="0 0 300 76" role=img aria-label="Línea de tiempo del uso"><text x="20" y="14">pasado</text><text x="280" y="14" text-anchor="end">futuro</text><text x="${X(50)}" y="14" text-anchor="middle" style="fill:var(--ink);font-weight:600">ahora</text><line x1="20" y1="${y}" x2="284" y2="${y}" stroke="var(--line)" stroke-width="3"/><path d="M284 ${y-5}l8 5-8 5z" fill="var(--line)"/><line x1="${X(50)}" y1="22" x2="${X(50)}" y2="58" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
 for(const k of m){const c="var(--acc)";
  if(k[0]=="d")s+=`<circle cx="${X(k[1])}" cy="${y}" r="7" fill="${c}"/>`;
  if(k[0]=="ds"){const n=k[3];for(let i=0;i<n;i++)s+=`<circle cx="${X(k[1]+(k[2]-k[1])*i/(n-1))}" cy="${y}" r="5" fill="${c}"/>`}
  if(k[0]=="r"){const a=X(k[1]),b=X(k[2]);if(k[3]){let d=`M${a} ${y}`;for(let x=a;x<b;x+=8)d+=`q2 -9 4 0 q2 9 4 0`;s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`}else s+=`<rect x="${a}" y="${y-4}" width="${b-a}" height="8" rx="4" fill="${c}"/>`}
  if(k[0]=="dash")s+=`<line x1="${X(k[1])}" y1="${y}" x2="${X(k[2])}" y2="${y}" stroke="${c}" stroke-width="3" stroke-dasharray="5 4"/><circle cx="${X(k[2])}" cy="${y}" r="7" fill="${c}"/>`;
  if(k[0]=="ref")s+=`<line x1="${X(k[1])}" y1="${y-12}" x2="${X(k[1])}" y2="${y+12}" stroke="var(--ink)" stroke-width="2"/><text x="${X(k[1])}" y="72" text-anchor="middle">${k[2]}</text>`}
 return s+"</svg>"}

/* ---------- VISTAS ---------- */
const TABS=[["tiempos","Tiempos verbales"],["vocab","Vocabulario"],["irreg","Irregulares"],["frases","Frases útiles"],["repaso","Repaso"]];
const badge=id=>P.s[id]!=null?`<span class="badge ${P.s[id]>=80?"done":""}">${P.s[id]>=80?"✓ ":""}${P.s[id]}%</span>`:"";
const rowT=t=>`<button class="card row" data-a=open data-v="${t.id}"><span class="tag ${t.g}"></span><span><b>${t.t}</b><small>${t.d||t.w.length+" "+(t.k=="f"?"frases":"palabras")}</small></span>${badge(t.id)}</button>`;
function stats(){const n=ALL.filter(t=>P.s[t.id]>=80).length;$("#stats").innerHTML=`<div class=stat><b>${n}/${ALL.length}</b>temas completados</div><div class=stat><b>${P.last==day(0)||P.last==day(1)?P.streak:0}</b>días seguidos</div><div class=stat><b>${P.err.length}</b>errores para repasar</div>`;
 $("#tabs").innerHTML=TABS.map(t=>`<button class="${S.tab==t[0]&&!S.Q&&!S.view?"on":""}" data-a=tab data-v=${t[0]}>${t[1]}</button>`).join("")}
function home(){const t=S.tab;let h="";
 if(t=="tiempos"){h=`<div class="card zone"><b>Práctica mixta</b><p class=sub>10 preguntas al azar de todos los tiempos verbales.</p><button class=btn data-a=mixT>Empezar</button></div>`;
  for(const[g,l]of[["Bases","Bases"],["Presente","Presente"],["Pasado","Pasado"],["Futuro","Futuro"],["Más","Para pulir"]])h+=`<div class=grp>${l}</div>`+TN.filter(x=>x.g==g).map(x=>rowT({...x,k:"t"})).join("")}
 if(t=="vocab"){h=`<div class="card zone"><b>Mezcla de vocabulario</b><p class=sub>12 palabras al azar de todas las categorías, en los dos sentidos.</p><button class=btn data-a=mixV>Empezar</button></div>`;
  for(const g of["Vida diaria","Trabajo en frontera","Turismo","Viajes propios"])h+=`<div class=grp>${g}</div>`+VC.filter(x=>x.g==g).map(x=>rowT({...x,k:"v"})).join("")}
 if(t=="irreg")h=`<h2>Verbos irregulares</h2><p class=sub>${IR.length} verbos frecuentes: forma base, pasado y participio.</p><div class=ojo><b>Truco para memorizarlos</b>Agrupalos por patrón. Iguales las tres: <i>cut, put, let</i>. Pasado y participio iguales: <i>buy-bought-bought, keep-kept-kept</i>. Las tres distintas: <i>go-went-gone, take-took-taken</i>. El participio se usa en el present perfect y el past perfect.</div><button class=btn data-a=irq>Practicar 8 verbos al azar</button><input class=search id=q type=search placeholder="Buscar en inglés o español" aria-label="Buscar verbo"><table class=stack><thead><tr><th>Verbo</th><th>Pasado</th><th>Participio</th><th>Significado</th><th></th></tr></thead><tbody id=irt>${irRows("")}</tbody></table>`;
 if(t=="frases")h=`<p class=sub>Frases completas para usar tal cual, con audio.</p>`+FR.map(x=>rowT({...x,k:"f"})).join("");
 if(t=="repaso"){const n=P.err.length,a=g=>{const l=ALL.filter(x=>g.includes(x.k));return`${l.filter(x=>P.s[x.id]>=80).length}/${l.length}`};
  h=`<div class="card zone"><b>Tus errores</b><div class=big>${n}</div><p class=sub style="text-align:center">${n?"Cada pregunta que fallás se guarda acá. Cuando la acertás, sale de la lista.":"No tenés errores pendientes. Cuando falles una pregunta, va a aparecer acá."}</p><button class=btn data-a=rep ${n?"":"disabled"}>Repasar ${Math.min(n,10)} errores</button></div>
  <div class=card><b>Avance por sección</b><table><tbody><tr><td>Tiempos verbales</td><td style="text-align:right">${a("t")}</td></tr><tr><td>Vocabulario</td><td style="text-align:right">${a("v")}</td></tr><tr><td>Frases útiles</td><td style="text-align:right">${a("f")}</td></tr></tbody></table><p class=pill>Un tema se completa con 80% o más. El progreso queda guardado en este navegador.</p></div>
  <button class="btn alt" data-a=reset>${S.conf?"Tocá de nuevo para borrar todo el progreso":"Borrar progreso"}</button>`}
 return h}
function irRows(f){f=norm(f);return IR.filter(r=>!f||r.some(x=>norm(x).includes(f))).map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${sp(r[0]+", "+r[1].replace("/"," or ")+", "+r[2].replace("/"," or "))}</td></tr>`).join("")||`<tr><td>No encontré ese verbo.</td></tr>`}
function topic(t){let h=`<button class=back data-a=back>← Volver</button><div><span class="lbl ${t.g}">${t.k=="t"?(t.g=="Más"?"Para pulir":t.g):t.g}</span></div><h2>${t.t}</h2>${t.d?`<p class=sub>${t.d}</p>`:""}`;
 if(t.k=="t"){h+=TL(t.tl)+`<div class=card>${t.exp}</div>`}
 else h+=`<div class=ojo><b>Tip</b>${t.tip}</div>`;
 if(t.k=="v")h+=`<h3>Palabras</h3><div class=words>${t.w.map(w=>`<div class=w><div>${w[0]}<br><span>${w[1]}</span></div>${sp(w[0])}</div>`).join("")}</div>`;
 const ex=t.k=="f"?t.w:t.ex;h+=`<h3>${t.k=="f"?"Frases":"Ejemplos"}</h3><div class=card>${ex.map(x=>`<div class=ex><div>${x[0]}<em>${x[1]}</em></div>${sp(x[0])}</div>`).join("")}</div><button class=btn data-a=go>Practicar${t.qs?` (${t.qs.length} ejercicios)`:""}</button>`;
 return h}
function quiz(){const Q=S.Q;
 if(Q.end){const p=Math.round(Q.s/Q.qs.length*100);return`<button class=back data-a=exit>← Volver</button><div class=card><h2>${Q.title}</h2><div class=big>${Q.s}/${Q.qs.length}</div><p style="text-align:center">${p>=80?"¡Excelente! "+(Q.id?"Tema completado.":""):"Buen intento. Repasá la explicación y probá de nuevo."}</p>${Q.qs.length-Q.s?`<p class=pill style="text-align:center">Las que fallaste quedaron en Repaso.</p>`:""}</div><button class=btn data-a=retry>Otra vuelta</button><button class="btn alt" data-a=exit>Volver</button>`}
 const q=Q.qs[Q.i],st=Q.st;let h=`<button class=back data-a=exit>← Salir</button><p class=pill>${Q.title} · ${Q.i+1} de ${Q.qs.length}</p><div class=bar><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div class=card>`;
 const qt=s=>s.replace(/___/g,"<span class=blank></span>");
 if(q.t=="mc")h+=`<div class=qq><span>${qt(q.q)}</span>${sp(q.sayQ)}</div>`+q.o.map((o,k)=>`<button class="o ${!st?"":k==q.a?"ok":k==st.k?"no":""}" data-a=mc data-v=${k}>${o}</button>`).join("");
 if(q.t=="w")h+=`<div class=qq><span>${qt(q.q)}</span>${sp(q.sayQ)}</div>`+q.f.map((f,j)=>`<label class=f>${f.l||"Tu respuesta"}<input class="t ${st?(match(st.given[j],f.a,q.v)?"ok":"no"):""}" id=f${j} autocomplete=off autocapitalize=off autocorrect=off spellcheck=false ${st?`disabled value="${esc(st.given[j])}"`:""}></label>`).join("")+(st?"":`<button class=btn data-a=check>Comprobar</button>`);
 if(q.t=="ord")h+=`<p class=pill>Ordená las palabras para formar la frase:</p><div class=qq>${q.es}</div><div class=line>${q.built.map((b,j)=>`<button class=chip data-a=un data-v=${j} ${st?"disabled":""}>${b.w}</button>`).join("")}</div><div class=pool>${q.pool.map((b,j)=>`<button class=chip data-a=ch data-v=${j}>${b.w}</button>`).join("")}</div>`+(st?"":`<button class=btn data-a=check ${q.pool.length?"disabled":""}>Comprobar</button>`);
 if(st){const right=q.t=="mc"?q.o[q.a]:q.t=="ord"?q.s:q.f.map(f=>f.a[0]).join(" · ");h+=`<div class="fb ${st.ok?"ok":"no"}"><div><b>${st.ok?"¡Correcto!":"Respuesta correcta: "+right}</b>${q.w?`<br>${q.w}`:""}</div>${sp(spoken(q))}</div>`}
 h+=`</div>`;if(st)h+=`<button class=btn data-a=next>${Q.i+1<Q.qs.length?"Siguiente":"Ver resultado"}</button>`;
 return h}
function R(){stats();const a=$("#app");a.innerHTML=S.Q?quiz():S.view?topic(find(S.view)):home();const i=$("#f0");if(i&&!i.disabled)i.focus({preventScroll:true})}

/* ---------- ACCIONES ---------- */
const go=t=>start(t.k=="t"?t.qs:t.k=="v"?genV(t.w):genF(t),t.id,t.t);
const A={
 tab:v=>{S.tab=v;S.view=null;S.Q=null;S.conf=0;R()},
 open:v=>{S.view=v;R();scrollTo(0,0)},
 back:()=>{S.view=null;R()},
 go:()=>go(find(S.view)),
 mixT:()=>start(sh(allTenseQs()).slice(0,10),null,"Práctica mixta de tiempos"),
 mixV:()=>start(genV(allWords(),12),null,"Mezcla de vocabulario"),
 irq:()=>start(genI(IR),null,"Verbos irregulares"),
 rep:()=>start(sh(P.err).slice(0,10),null,"Repaso de errores",1),
 mc:v=>{const Q=S.Q,q=Q.qs[Q.i];if(Q.st)return;const k=+v;grade(k==q.a,[]);Q.st.k=k;R()},
 ch:v=>{const q=S.Q.qs[S.Q.i];if(S.Q.st)return;q.built.push(q.pool.splice(+v,1)[0]);R()},
 un:v=>{const q=S.Q.qs[S.Q.i];if(S.Q.st)return;q.pool.push(q.built.splice(+v,1)[0]);R()},
 check, next,
 retry:()=>{const Q=S.Q;if(Q.rep)return A.rep();if(Q.title=="Práctica mixta de tiempos")return A.mixT();if(Q.title=="Mezcla de vocabulario")return A.mixV();if(Q.title=="Verbos irregulares")return A.irq();go(find(Q.id))},
 exit:()=>{S.Q=null;R();scrollTo(0,0)},
 reset:()=>{if(!S.conf){S.conf=1;R();return}P={s:{},err:[],streak:0,last:""};save();S.conf=0;R()}
};
document.addEventListener("click",e=>{const s=e.target.closest("[data-say]");if(s){say(s.dataset.say);return}const b=e.target.closest("[data-a]");if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener("input",e=>{if(e.target.id=="q")$("#irt").innerHTML=irRows(e.target.value)});
document.addEventListener("keydown",e=>{if(e.key!="Enter"||!S.Q||S.Q.end)return;if(S.Q.st){e.preventDefault();next()}else if(e.target.classList&&e.target.classList.contains("t")){e.preventDefault();check()}});
try{speechSynthesis.onvoiceschanged=()=>{VO=null}}catch(e){}
R();
}
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body></html>
